<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <!-- خلفية زرقاء -->
  <rect width="500" height="300" fill="#007bcb"/>
  
  <!-- شعار IPS -->
  <g transform="translate(100, 100) scale(1.5)">
    <!-- حرف I باللون الأبيض -->
    <rect x="0" y="0" width="20" height="100" fill="#ffffff" rx="5" ry="5"/>
    
    <!-- حرف P باللون الأبيض -->
    <path d="M30,0 h50 a30,30 0 0,1 0,60 h-50 v40 h-20 v-100 z" fill="#ffffff"/>
    <path d="M50,20 h20 a10,10 0 0,1 0,20 h-20 z" fill="#007bcb"/>
    
    <!-- حرف S باللون الأحمر مع تأثيرات الإنذار -->
    <path d="M120,20 h30 a20,20 0 0,1 0,40 a20,20 0 0,1 0,40 h-30" fill="#e40045" stroke="#e40045" stroke-width="5"/>
    
    <!-- خطوط الإنذار -->
    <line x1="150" y1="0" x2="170" y2="20" stroke="#e40045" stroke-width="8" stroke-linecap="round"/>
    <line x1="170" y1="40" x2="190" y2="20" stroke="#e40045" stroke-width="8" stroke-linecap="round"/>
    <line x1="170" y1="40" x2="150" y2="60" stroke="#e40045" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- النص "Protect what matters most" -->
  <text x="250" y="240" font-family="Montserrat, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">Protect what matters most</text>
</svg>
